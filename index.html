<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقویم ۱۴۰۵</title>
    <meta name="theme-color" content="#1a1f2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="تقویم ۱۴۰۵">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231a1f2e'/><text x='50' y='68' font-size='48' fill='white' text-anchor='middle' font-family='serif'>۱۴۰۵</text></svg>">
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    
    <style>
        /* ============ متغیرها ============ */
        :root {
            --bg-primary: #1a1f2e;
            --bg-secondary: #232838;
            --bg-tertiary: #2d3345;
            --bg-elevated: #363d52;
            
            --glass-bg: rgba(45, 51, 69, 0.7);
            --glass-bg-strong: rgba(54, 61, 82, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            
            --text-primary: #e8eaf0;
            --text-secondary: #9ba3b8;
            --text-muted: #6b7285;
            
            --accent-primary: #4a6fa5;
            --accent-secondary: #5d82b8;
            --accent-hover: #6089c7;
            --today-bg: #4a6fa5;
            --today-border: #5d82b8;
            --friday: #c47a7a;
            --thursday: #7a9bc4;
            --success: #6ba574;
            --warning: #c4a55d;
            --danger: #b85c5c;
            
            --transition: 0.2s ease;
            --radius: 8px;
            --radius-sm: 6px;
            --radius-lg: 12px;
        }
        
        body.light {
            --bg-primary: #e8eaf0;
            --bg-secondary: #dcdfe8;
            --bg-tertiary: #cdd2dd;
            --bg-elevated: #ffffff;
            --glass-bg: rgba(220, 223, 232, 0.85);
            --glass-bg-strong: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(0, 0, 0, 0.08);
            --glass-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --text-primary: #1a1f2e;
            --text-secondary: #4a5468;
            --text-muted: #7a8499;
            --accent-primary: #3a5a8a;
            --accent-secondary: #4a6fa5;
            --today-bg: #4a6fa5;
            --today-border: #3a5a8a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            overflow-x: hidden;
        }
        
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            transition: background var(--transition), color var(--transition);
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            max-width: 960px;
            margin: auto;
            position: relative;
            z-index: 1;
        }
        
        /* ============ هدر ============ */
        .header {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 20px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            position: sticky;
            top: 16px;
            z-index: 100;
            margin-bottom: 16px;
        }
        
        .header h1 {
            font-size: 1.15em;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .header h1::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: var(--accent-primary);
            margin-left: 10px;
            vertical-align: middle;
            border-radius: 2px;
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 9px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85em;
            font-weight: 500;
            transition: all var(--transition);
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .btn:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border-color: var(--accent-primary);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            opacity: 0.8;
        }
        
        .badge {
            background: var(--danger);
            color: white;
            font-size: 0.7em;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: 700;
            min-width: 18px;
            text-align: center;
            line-height: 1.4;
        }
        
        /* ============ نوار اطلاعات ============ */
        .info-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: var(--radius-lg);
            padding: 14px 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.9em;
        }
        .info-main {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }
        .info-main .label {
            color: var(--text-muted);
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .info-main .value {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.05em;
            font-variant-numeric: tabular-nums;
        }
        .info-date {
            color: var(--text-secondary);
            font-size: 0.85em;
            font-variant-numeric: tabular-nums;
        }
        
        /* ============ تب‌ها ============ */
        .view-tabs {
            display: flex;
            gap: 4px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: var(--radius-lg);
            padding: 4px;
            margin-bottom: 16px;
        }
        .view-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 11px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.88em;
            font-weight: 600;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .view-tab:hover {
            color: var(--text-primary);
        }
        .view-tab.active {
            background: var(--accent-primary);
            color: white;
        }
        
        /* ============ کارت تقویم ============ */
        .calendar-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 16px;
        }
        
        .month-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--glass-border);
        }
        .month-nav h2 {
            font-size: 1.3em;
            font-weight: 700;
            flex: 1;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .nav-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1.1em;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }
        .nav-btn:hover {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
            border-color: var(--accent-primary);
        }
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        /* ============ تقویم ============ */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        
        .day-name-cell {
            text-align: center;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.75em;
            padding: 10px 4px;
            letter-spacing: 1px;
        }
        
        .day-cell {
            aspect-ratio: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 1em;
            transition: all var(--transition);
            position: relative;
            user-select: none;
            padding: 4px;
        }
        .day-cell:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent-primary);
            transform: translateY(-1px);
        }
        .day-cell:active {
            transform: scale(0.97);
        }
        .day-cell.empty {
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.05);
            cursor: default;
        }
        .day-cell.empty:hover {
            transform: none;
            border-color: rgba(255, 255, 255, 0.05);
        }
        .day-cell.today {
            background: var(--today-bg);
            border-color: var(--today-border);
            font-weight: 700;
            color: white;
        }
        .day-cell.selected {
            background: var(--accent-primary);
            border-color: var(--accent-secondary);
            color: white;
        }
        .day-cell.friday:not(.today):not(.selected) {
            color: var(--friday);
        }
        .day-cell.thursday:not(.today):not(.selected) {
            color: var(--thursday);
        }
        
        .day-number {
            font-size: 1em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        
        .day-indicator {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--success);
        }
        
        /* ============ نمای هفتگی ============ */
        .week-view {
            display: none;
        }
        .week-view.active {
            display: block;
        }
        .week-header {
            display: grid;
            grid-template-columns: 70px repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 8px;
            position: sticky;
            top: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: 8px 0;
            z-index: 5;
            border-radius: var(--radius-sm);
        }
        .week-header-cell {
            text-align: center;
            padding: 8px 4px;
            font-weight: 600;
            font-size: 0.75em;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
        }
        .week-header-cell.today {
            background: var(--accent-primary);
            color: white;
        }
        .week-header-cell .wd {
            display: block;
            font-size: 0.7em;
            color: var(--text-muted);
            margin-bottom: 3px;
        }
        .week-header-cell.today .wd {
            color: rgba(255,255,255,0.8);
        }
        .week-header-cell .dn {
            font-size: 1em;
            font-weight: 700;
        }
        .week-body {
            display: grid;
            grid-template-columns: 70px repeat(7, 1fr);
            gap: 4px;
        }
        .week-time-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .week-time-label {
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65em;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }
        .week-day-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .week-slot {
            height: 22px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 0.6em;
            padding: 0 4px;
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .week-slot:hover {
            border-color: var(--accent-primary);
            background: var(--bg-tertiary);
        }
        .week-slot.has-note {
            background: rgba(74, 111, 165, 0.2);
            border-color: var(--accent-primary);
            color: var(--text-primary);
        }
        .week-slot.has-note.done {
            background: rgba(107, 165, 116, 0.2);
            border-color: var(--success);
            opacity: 0.7;
            text-decoration: line-through;
        }
        .week-slot.sleep {
            background: rgba(0, 0, 0, 0.2);
            border-color: transparent;
            cursor: default;
            opacity: 0.4;
        }
        .week-slot.sleep:hover {
            border-color: transparent;
            background: rgba(0, 0, 0, 0.2);
        }
        
        /* ============ نمای روزانه ============ */
        .day-view {
            display: none;
        }
        .day-view.active {
            display: block;
        }
        
        /* ============ پنجره شناور ============ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 720px;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .modal-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: var(--bg-tertiary);
        }
        .modal-header h3 {
            font-size: 1em;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .modal-close {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.9em;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }
        .modal-close:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        
        .modal-body {
            padding: 18px 22px;
            overflow-y: auto;
            flex: 1;
            background: var(--bg-secondary);
        }
        
        .modal-body::-webkit-scrollbar,
        .slots-container::-webkit-scrollbar {
            width: 8px;
        }
        .modal-body::-webkit-scrollbar-track,
        .slots-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .modal-body::-webkit-scrollbar-thumb,
        .slots-container::-webkit-scrollbar-thumb {
            background: var(--bg-elevated);
            border-radius: 10px;
        }
        .modal-body::-webkit-scrollbar-thumb:hover,
        .slots-container::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }
        
        /* ============ بازه‌ها ============ */
        .slots-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        
        .slot-row {
            display: grid;
            grid-template-columns: 110px 1fr 1fr;
            gap: 6px;
            align-items: stretch;
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 6px;
            transition: all var(--transition);
            position: relative;
        }
        .slot-row:hover {
            border-color: var(--accent-primary);
        }
        .slot-row.has-note {
            border-right: 3px solid var(--accent-primary);
        }
        .slot-row.done {
            border-right: 3px solid var(--success);
            opacity: 0.7;
        }
        .slot-row.sleep {
            background: rgba(0, 0, 0, 0.15);
            border-color: transparent;
            opacity: 0.5;
        }
        .slot-row.sleep:hover {
            border-color: transparent;
        }
        
        .slot-time {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75em;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            padding: 6px 4px;
            font-variant-numeric: tabular-nums;
        }
        
        .slot-input {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85em;
            transition: all var(--transition);
            width: 100%;
        }
        .slot-input::placeholder {
            color: var(--text-muted);
        }
        .slot-input:focus {
            outline: none;
            background: var(--bg-primary);
            border-color: var(--accent-primary);
        }
        
        .slot-check {
            display: none;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: 2px solid var(--glass-border);
            border-radius: 50%;
            cursor: pointer;
            transition: all var(--transition);
            background: transparent;
            flex-shrink: 0;
        }
        .slot-row.has-check .slot-check {
            display: flex;
        }
        .slot-check:hover {
            border-color: var(--accent-primary);
        }
        .slot-check.checked {
            background: var(--success);
            border-color: var(--success);
        }
        .slot-check.checked::after {
            content: '✓';
            color: white;
            font-weight: 700;
            font-size: 0.9em;
        }
        .slot-row.has-check {
            grid-template-columns: 110px 40px 1fr 1fr;
        }
        
        /* ============ منوی Long Press ============ */
        .context-menu {
            position: fixed;
            background: var(--bg-elevated);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            padding: 4px;
            z-index: 2000;
            display: none;
            min-width: 200px;
            animation: menuPop 0.15s ease;
        }
        .context-menu.active {
            display: block;
        }
        
        @keyframes menuPop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .context-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 500;
            transition: all var(--transition);
            color: var(--text-primary);
        }
        .context-menu-item:hover {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
        }
        .context-menu-item.danger {
            color: var(--danger);
        }
        .context-menu-item.danger:hover {
            background: rgba(184, 92, 92, 0.15);
        }
        
        /* ============ تنظیمات ============ */
        .settings-group {
            margin-bottom: 20px;
        }
        .settings-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85em;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .settings-group input,
        .settings-group select {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9em;
            transition: all var(--transition);
        }
        .settings-group input:focus,
        .settings-group select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        .settings-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        /* ============ لیست عقب‌افتاده ============ */
        .pending-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .pending-item {
            background: var(--bg-tertiary);

<script>
// ============ Supabase ============
var SUPABASE_URL = 'https://moaofxlfantlijlkmcoi.supabase.co';
var SUPABASE_KEY = 'sb_publishable_mfrt-MTazEyu1UnkfhK7Dw_15WR3s5R';

var SB = null;
try {
    SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch(e) {
    console.error('Supabase error:', e);

// ============ Constants ============
var MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var DAY_SHORT = ['ش','ی','د','س','چ','پ','ج'];
var DAY_FULL = ['شنبه','یکشنبه','دوشنبه','سه شنبه','چهارشنبه','پنج شنبه','جمعه'];
var DAYS_IN_MONTH = [31,31,31,31,31,31,30,30,30,30,30,29];
var YEAR_START = new Date(2026, 2, 21);

// ============ State ============
var currentMonth = 0;
var currentWeekStart = null;
var currentDayDate = null;
var isDark = true;
var NOTES = {};
var SETTINGS = {
    sleepStart: '00:00',
    sleepEnd: '06:40'
};
var activeContextSlot = null;
var longPressTimer = null;

// ============ Date Conversion ============
function g2p(d) {
    var gy = d.getFullYear();
    var gm = d.getMonth() + 1;
    var gd = d.getDate();
    var gdi = [31,28,31,30,31,30,31,31,30,31,30,31];
    if ((gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0) gdi[1] = 29;
    
    var dn = 365 * (gy - 1600) + Math.floor((gy - 1600 + 3) / 4) - Math.floor((gy - 1600 + 99) / 100) + Math.floor((gy - 1600 + 399) / 400);
    for (var i = 0; i < gm - 1; i++) dn += gdi[i];
    dn += gd - 1;
    
    var pn = dn - 79;
    var pp = Math.floor(pn / 12053);
    pn = pn % 12053;
    var py = 979 + 33 * pp + 4 * Math.floor(pn / 1461);
    pn = pn % 1461;
    if (pn >= 366) {
        py += Math.floor((pn - 1) / 365);
        pn = (pn - 1) % 365;
    }
    
    var pdi = [31,31,31,31,31,31,30,30,30,30,30,29];
    var pm = 0;
    while (pn >= pdi[pm] && pm < 11) {
        pn -= pdi[pm];
        pm++;
    }
    
    return { y: py, m: pm + 1, d: pn + 1 };
}

function getDayOfWeek(d) {
    return (d.getDay() + 1) % 7;
}

function pnum(n) {
    var s = String(n);
    var out = '';
    for (var i = 0; i < s.length; i++) {
        var c = s.charAt(i);
        if (c >= '0' && c <= '9') {
            out += '۰۱۲۳۴۵۶۷۸۹'.charAt(parseInt(c));
        } else {
            out += c;
        }
    }
    return out;
}

function pad2(n) {
    return String(n).padStart(2, '0');
}

function dk(y, m, d) {
    return y + '-' + pad2(m) + '-' + pad2(d);
}

function slotKey(dateKey, slotIdx) {
    return dateKey + '-s' + slotIdx;
}

// ============ Month Helpers ============
function getFirstDayOfMonth(m) {
    var d = new Date(YEAR_START);
    for (var i = 0; i < m; i++) d.setDate(d.getDate() + DAYS_IN_MONTH[i]);
    return d;
}

function getToday() {
    return g2p(new Date());
}

// ============ Slots ============
function generateSlots() {
    var slots = [];
    var sleepStartMin = parseInt(SETTINGS.sleepStart.split(':')[0]) * 60 + parseInt(SETTINGS.sleepStart.split(':')[1]);
    var sleepEndMin = parseInt(SETTINGS.sleepEnd.split(':')[0]) * 60 + parseInt(SETTINGS.sleepEnd.split(':')[1]);
    
    var slotIdx = 0;
    for (var h = 0; h < 24; h++) {
        for (var m = 0; m < 60; m += 15) {
            var startStr = pad2(h) + ':' + pad2(m);
            var totalMin = h * 60 + m;
            
            var isSleep = false;
            if (sleepStartMin < sleepEndMin) {
                isSleep = totalMin >= sleepStartMin && totalMin < sleepEndMin;
            } else {
                isSleep = totalMin >= sleepStartMin || totalMin < sleepEndMin;
            }
            
            slots.push({
                index: slotIdx,
                hour: h,
                minute: m,
                start: startStr,
                isSleep: isSleep
            });
            slotIdx++;
        }
    }
    return slots;
}

function getSlotTime(startStr) {
    var parts = startStr.split(':');
    var h = parseInt(parts[0]);
    var m = parseInt(parts[1]) + 15;
    if (m === 60) { h++; m = 0; }
    if (h === 24) h = 0;
    return pad2(h) + ':' + pad2(m);
}

// ============ Local Storage ============
function loadLocal() {
    try {
        NOTES = JSON.parse(localStorage.getItem('taghvim-notes') || '{}');
    } catch(e) { NOTES = {}; }
    
    try {
        var s = JSON.parse(localStorage.getItem('taghvim-settings') || '{}');
        if (s.sleepStart) SETTINGS.sleepStart = s.sleepStart;
        if (s.sleepEnd) SETTINGS.sleepEnd = s.sleepEnd;
    } catch(e) {}
}

function saveLocal() {
    localStorage.setItem('taghvim-notes', JSON.stringify(NOTES));
    localStorage.setItem('taghvim-settings', JSON.stringify(SETTINGS));
}

// ============ Supabase ============
async function loadCloud() {
    if (!SB) return;
    try {
        var result = await SB.from('notes').select('*').eq('year', 1405);
        if (result.data) {
            result.data.forEach(function(r) {
                NOTES[r.slot_key] = {
                    title: r.title || '',
                    description: r.description || '',
                    hasCheck: r.has_check || false,
                    checked: r.checked || false
                };
            });
        }
        saveLocal();
    } catch(e) {
        console.error('Load error:', e);
    }
}

async function saveCloud(sKey, data) {
    if (!SB) return;
    try {
        await SB.from('notes').delete().eq('slot_key', sKey);
        await SB.from('notes').insert({
            slot_key: sKey,
            year: 1405,
            title: data.title || '',
            description: data.description || '',
            has_check: data.hasCheck || false,
            checked: data.checked || false,
            updated_at: new Date().toISOString()
        });
    } catch(e) {
        console.error('Save error:', e);
    }
}

async function deleteCloud(sKey) {
    if (!SB) return;
    try {
        await SB.from('notes').delete().eq('slot_key', sKey);
    } catch(e) {}
}

// ============ Sync ============
setInterval(async function() {
    if (!SB) return;
    try {
        var result = await SB.from('notes').select('*').eq('year', 1405);
        if (!result.data) return;
        
        var changed = false;
        result.data.forEach(function(r) {
            var old = NOTES[r.slot_key];
            var newData = {
                title: r.title || '',
                description: r.description || '',
                hasCheck: r.has_check || false,
                checked: r.checked || false
            };
            if (!old || old.title !== newData.title || old.description !== newData.description || old.hasCheck !== newData.hasCheck || old.checked !== newData.checked) {
                NOTES[r.slot_key] = newData;
                changed = true;
            }
        });
        
        if (changed) {
            saveLocal();
            updateAllViews();
        }
    } catch(e) {}
}, 3000);

// ============ Today Info ============
function calcTodayHours() {
    var today = getToday();
    var dateKey = dk(today.y, today.m, today.d);
    var count = 0;
    for (var i = 0; i < 96; i++) {
        var n = NOTES[slotKey(dateKey, i)];
        if (n && (n.title || n.description)) count++;
    }
    var hours = Math.floor(count * 15 / 60);
    var mins = (count * 15) % 60;
    
    var result = '';
    if (hours > 0) result += pnum(hours) + ' ساعت';
    if (mins > 0) {
        if (result) result += ' و ';
        result += pnum(mins) + ' دقیقه';
    }
    if (!result) result = '۰ دقیقه';
    return result;
}

function updateTodayInfo() {
    document.getElementById('todaySummary').textContent = calcTodayHours();
    var t = getToday();
    document.getElementById('todayDate').textContent = pnum(t.y) + '/' + pad2(t.m) + '/' + pad2(t.d);
}

function hasNoteForDay(dateKey) {
    for (var i = 0; i < 96; i++) {
        var n = NOTES[slotKey(dateKey, i)];
        if (n && (n.title || n.description)) return true;
    }
    return false;
}

// ============ Pending ============
function countPending() {
    var today = getToday();
    var todayKey = dk(today.y, today.m, today.d);
    var count = 0;
    
    Object.keys(NOTES).forEach(function(k) {
        var n = NOTES[k];
        if (n.hasCheck && !n.checked) {
            var datePart = k.split('-s')[0];
            if (datePart < todayKey) count++;
        }
    });
    return count;
}

function updatePendingBadge() {
    var count = countPending();
    document.getElementById('pendingBadge').textContent = pnum(count);
    document.getElementById('pendingBadge').style.display = count > 0 ? 'inline-block' : 'none';
}

// ============ Render Calendar ============
function renderCalendar() {
    var grid = document.getElementById('calendarGrid');
    var title = document.getElementById('monthTitle');
    
    title.textContent = MONTHS[currentMonth] + ' ۱۴۰۵';
    
    var html = '';
    DAY_SHORT.forEach(function(d) {
        html += '<div class="day-name-cell">' + d + '</div>';
    });
    
    var firstDay = getFirstDayOfMonth(currentMonth);
    var startDow = getDayOfWeek(firstDay);
    var daysCount = DAYS_IN_MONTH[currentMonth];
    var today = getToday();
    
    for (var i = 0; i < startDow; i++) {
        html += '<div class="day-cell empty"></div>';
    }
    
    var cur = new Date(firstDay);
    for (var d = 1; d <= daysCount; d++) {
        var pd = g2p(cur);
        var dow = getDayOfWeek(cur);
        var dateKey = dk(pd.y, pd.m, pd.d);
        var isToday = pd.y === today.y && pd.m === today.m && pd.d === today.d;
        
        var cls = 'day-cell';
        if (dow === 6) cls += ' friday';
        if (dow === 5) cls += ' thursday';
        if (isToday) cls += ' today';
        if (hasNoteForDay(dateKey)) cls += ' has-note';
        
        var indicator = hasNoteForDay(dateKey) ? '<div class="day-indicator"></div>' : '';
        
        html += '<div class="' + cls + '" onclick="openDay(' + d + ', this)" data-m="' + currentMonth + '" data-d="' + d + '">' +
                '<span class="day-number">' + pnum(d) + '</span>' +
                indicator +
                '</div>';
        cur.setDate(cur.getDate() + 1);
    }
    
    grid.innerHTML = html;
}

function prevMonth() {
    currentMonth = (currentMonth - 1 + 12) % 12;
    renderCalendar();
}

function nextMonth() {
    currentMonth = (currentMonth + 1) % 12;
    renderCalendar();
}

// ============ Open Day ============
function openDay(d, el) {
    document.querySelectorAll('.day-cell.selected').forEach(function(c) { c.classList.remove('selected'); });
    if (el) el.classList.add('selected');
    
    var firstDay = getFirstDayOfMonth(currentMonth);
    var targetDate = new Date(firstDay.getTime() + (d - 1) * 86400000);
    var pd = g2p(targetDate);
    var dow = getDayOfWeek(targetDate);
    var dateKey = dk(pd.y, pd.m, pd.d);
    
    document.getElementById('modalTitle').textContent = 
        pnum(pd.y) + '/' + pad2(pd.m) + '/' + pad2(pd.d) + ' - ' + DAY_FULL[dow];
    
    renderSlots(document.getElementById('slotsContainer'), dateKey);
    document.getElementById('dayModal').classList.add('active');
}

// ============ Render Slots ============
function renderSlots(container, dateKey) {
    var slots = generateSlots();
    var html = '';
    
    slots.forEach(function(s) {
        var sKey = slotKey(dateKey, s.index);
        var note = NOTES[sKey] || {};
        var endTime = getSlotTime(s.start);
        
        if (s.isSleep) {
            html += '<div class="slot-row sleep" data-slot="' + sKey + '">' +
                    '<div class="slot-time">' + s.start + ' - ' + endTime + '</div>' +
                    '<div style="grid-column: span 2; display:flex; align-items:center; color:var(--text-muted); font-size:0.8em;">خواب</div>' +
                    '</div>';
        } else {
            var rowCls = 'slot-row';
            if (note.title || note.description) rowCls += ' has-note';
            if (note.hasCheck) rowCls += ' has-check';
            if (note.checked) rowCls += ' done';
            
            html += '<div class="' + rowCls + '" data-slot="' + sKey + '">' +
                    '<div class="slot-time">' + s.start + ' - ' + endTime + '</div>';
            
            if (note.hasCheck) {
                html += '<div class="slot-check' + (note.checked ? ' checked' : '') + '" onclick="toggleCheck(\'' + sKey + '\')"></div>';
            }
            
            html += '<input class="slot-input" placeholder="عنوان" value="' + escapeHtml(note.title || '') + '" data-field="title" oninput="updateNote(\'' + sKey + '\', \'title\', this.value)">' +
                    '<input class="slot-input" placeholder="توضیحات" value="' + escapeHtml(note.description || '') + '" data-field="description" oninput="updateNote(\'' + sKey + '\', \'description\', this.value)">' +
                    '</div>';
        }
    });
    
    container.innerHTML = html;
    
    container.querySelectorAll('.slot-row:not(.sleep)').forEach(function(row) {
        var slotKeyVal = row.dataset.slot;
        
        row.addEventListener('touchstart', function(e) {
            longPressTimer = setTimeout(function() {
                showContextMenu(e.touches[0].clientX, e.touches[0].clientY, slotKeyVal);
            }, 600);
        }, { passive: true });
        
        row.addEventListener('touchend', function() { clearTimeout(longPressTimer); });
        row.addEventListener('touchmove', function() { clearTimeout(longPressTimer); });
        
        row.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            showContextMenu(e.clientX, e.clientY, slotKeyVal);
        });
    });
}

function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============ Update Note ============
function updateNote(sKey, field, value) {
    if (!NOTES[sKey]) NOTES[sKey] = { title: '', description: '', hasCheck: false, checked: false };
    NOTES[sKey][field] = value;
    
    var row = document.querySelector('[data-slot="' + sKey + '"]');
    if (row) {
        if (NOTES[sKey].title || NOTES[sKey].description) row.classList.add('has-note');
        else row.classList.remove('has-note');
    }
    
    saveLocal();
    clearTimeout(window._saveT);
    window._saveT = setTimeout(function() {
        saveCloud(sKey, NOTES[sKey]);
        updateTodayInfo();
        updatePendingBadge();
    }, 500);
}

// ============ Toggle Check ============
function toggleCheck(sKey) {
    if (!NOTES[sKey]) return;
    NOTES[sKey].checked = !NOTES[sKey].checked;
    
    var row = document.querySelector('[data-slot="' + sKey + '"]');
    if (row) {
        var check = row.querySelector('.slot-check');
        if (check) {
            check.classList.toggle('checked', NOTES[sKey].checked);
        }
        row.classList.toggle('done', NOTES[sKey].checked);
    }
    
    saveLocal();
    saveCloud(sKey, NOTES[sKey]);
    updatePendingBadge();
}

// ============ Context Menu ============
function showContextMenu(x, y, sKey) {
    activeContextSlot = sKey;
    var menu = document.getElementById('contextMenu');
    var note = NOTES[sKey] || {};
    
    document.getElementById('menuToggleText').textContent = 
        note.hasCheck ? 'غیرفعال کردن تیک' : 'فعال کردن تیک';
    
    menu.style.left = Math.min(x, window.innerWidth - 220) + 'px';
    menu.style.top = Math.min(y, window.innerHeight - 150) + 'px';
    menu.classList.add('active');
}

function menuAction(action) {
    document.getElementById('contextMenu').classList.remove('active');
    if (!activeContextSlot) return;
    
    var sKey = activeContextSlot;
    var rows = document.querySelectorAll('#slotsContainer .slot-row');
    var dateKey = null;
    if (rows.length > 0) {
        dateKey = rows[0].dataset.slot.split('-s')[0];
    }
    
    if (action === 'toggleCheck') {
        if (!NOTES[sKey]) NOTES[sKey] = { title: '', description: '', hasCheck: false, checked: false };
        NOTES[sKey].hasCheck = !NOTES[sKey].hasCheck;
        if (!NOTES[sKey].hasCheck) NOTES[sKey].checked = false;
        saveLocal();
        saveCloud(sKey, NOTES[sKey]);
        
        if (dateKey) {
            renderSlots(document.getElementById('slotsContainer'), dateKey);
        }
        updatePendingBadge();
    }
    
    if (action === 'clear') {
        delete NOTES[sKey];
        saveLocal();
        deleteCloud(sKey);
        
        if (dateKey) {
            renderSlots(document.getElementById('slotsContainer'), dateKey);
        }
        updateTodayInfo();
        updatePendingBadge();
    }
    
    activeContextSlot = null;
}

document.addEventListener('click', function(e) {
    if (!e.target.closest('.context-menu')) {
        document.getElementById('contextMenu').classList.remove('active');
    }
});

// ============ Close Modals ============
function closeDayModal() {
    document.getElementById('dayModal').classList.remove('active');
}

function closeModal(e) {
    if (e.target.id === 'dayModal') closeDayModal();
}

function closeSettingsModal(e) {
    if (!e || e.target.id === 'settingsModal') {
        document.getElementById('settingsModal').classList.remove('active');
    }
}

function closePendingModal(e) {
    if (!e || e.target.id === 'pendingModal') {
        document.getElementById('pendingModal').classList.remove('active');
    }
}

// ============ Switch View ============
function switchView(v, btn) {
    document.querySelectorAll('.view-tab').forEach(function(t) { t.classList.remove('active'); });
    btn.classList.add('active');
    
    document.getElementById('monthView').style.display = 'none';
    document.getElementById('weekView').style.display = 'none';
    document.getElementById('dayView').style.display = 'none';
    
    if (v === 'month') {
        document.getElementById('monthView').style.display = 'block';
    } else if (v === 'week') {
        document.getElementById('weekView').style.display = 'block';
        initWeekView();
    } else if (v === 'day') {
        document.getElementById('dayView').style.display = 'block';
        initDayView();
    }
}

// ============ Week View ============
function initWeekView() {
    if (!currentWeekStart) {
        var today = getToday();
        var firstDay = getFirstDayOfMonth(today.m - 1);
        var dayInMonth = today.d - 1;
        var todayDate = new Date(firstDay.getTime() + dayInMonth * 86400000);
        var dow = getDayOfWeek(todayDate);
        currentWeekStart = new Date(todayDate.getTime() - dow * 86400000);
    }
    renderWeek();
}

function renderWeek() {
    var container = document.getElementById('weekContainer');
    var today = getToday();
    var slots = generateSlots();
    
    var html = '<div class="week-header">';
    html += '<div class="week-header-cell"></div>';
    
    var weekDates = [];
    for (var i = 0; i < 7; i++) {
        var d = new Date(currentWeekStart.getTime() + i * 86400000);
        weekDates.push(d);
        var pd = g2p(d);
        var isToday = pd.y === today.y && pd.m === today.m && pd.d === today.d;
        html += '<div class="week-header-cell' + (isToday ? ' today' : '') + '">' +
                '<span class="wd">' + DAY_SHORT[i] + '</span>' +
                '<span class="dn">' + pnum(pd.d) + '</span>' +
                '</div>';
    }
    html += '</div>';
    
    html += '<div class="week-body">';
    html += '<div class="week-time-col">';
    slots.forEach(function(s) {
        if (s.isSleep) return;
        html += '<div class="week-time-label">' + s.start + '</div>';
    });
    html += '</div>';
    
    weekDates.forEach(function(d) {
        var pd = g2p(d);
        var dateKey = dk(pd.y, pd.m, pd.d);
        html += '<div class="week-day-col">';
        
        slots.forEach(function(s) {
            if (s.isSleep) return;
            var sKey = slotKey(dateKey, s.index);
            var note = NOTES[sKey] || {};
            var cls = 'week-slot';
            if (note.title || note.description) cls += ' has-note';
            if (note.checked) cls += ' done';
            
            var title = note.title ? escapeHtml(note.title) : '';
            html += '<div class="' + cls + '" onclick="openWeekSlot(\'' + sKey + '\')" title="' + s.start + ' - ' + title + '">' + (title || '') + '</div>';
        });
        
        html += '</div>';
    });
    
    html += '</div>';
    container.innerHTML = html;
    
    var firstPd = g2p(weekDates[0]);
    var lastPd = g2p(weekDates[6]);
    document.getElementById('weekTitle').textContent = 
        pnum(firstPd.d) + ' ' + MONTHS[firstPd.m - 1] + ' تا ' + pnum(lastPd.d) + ' ' + MONTHS[lastPd.m - 1];
}

function openWeekSlot(sKey) {
    var dateKey = sKey.split('-s')[0];
    var parts = dateKey.split('-');
    var y = parseInt(parts[0]);
    var m = parseInt(parts[1]);
    var d = parseInt(parts[2]);
    
    var firstDay = getFirstDayOfMonth(m - 1);
    var targetDate = new Date(firstDay.getTime() + (d - 1) * 86400000);
    var dow = getDayOfWeek(targetDate);
    
    document.getElementById('modalTitle').textContent = 
        pnum(y) + '/' + pad2(m) + '/' + pad2(d) + ' - ' + DAY_FULL[dow];
    
    renderSlots(document.getElementById('slotsContainer'), dateKey);
    document.getElementById('dayModal').classList.add('active');
}

function prevWeek() {
    currentWeekStart = new Date(currentWeekStart.getTime() - 7 * 86400000);
    renderWeek();
}

function nextWeek() {
    currentWeekStart = new Date(currentWeekStart.getTime() + 7 * 86400000);
    renderWeek();
}

// ============ Day View ============
function initDayView() {
    if (!currentDayDate) {
        currentDayDate = new Date();
    }
    renderDayView();
}

function renderDayView() {
    var pd = g2p(currentDayDate);
    var dow = getDayOfWeek(currentDayDate);
    var dateKey = dk(pd.y, pd.m, pd.d);
    
    document.getElementById('dayTitle').textContent = 
        pnum(pd.y) + '/' + pad2(pd.m) + '/' + pad2(pd.d) + ' - ' + DAY_FULL[dow];
    
    renderSlots(document.getElementById('dayViewSlots'), dateKey);
}

function prevDay() {
    currentDayDate = new Date(currentDayDate.getTime() - 86400000);
    renderDayView();
}

function nextDay() {
    currentDayDate = new Date(currentDayDate.getTime() + 86400000);
    renderDayView();
}

// ============ Settings ============
function openSettings() {
    document.getElementById('sleepStart').value = SETTINGS.sleepStart;
    document.getElementById('sleepEnd').value = SETTINGS.sleepEnd;
    document.getElementById('settingsModal').classList.add('active');
}

function saveSettings() {
    SETTINGS.sleepStart = document.getElementById('sleepStart').value || '00:00';
    SETTINGS.sleepEnd = document.getElementById('sleepEnd').value || '06:40';
    saveLocal();
    closeSettingsModal();
    updateAllViews();
}

// ============ Pending List ============
function openPending() {
    var list = document.getElementById('pendingList');
    var today = getToday();
    var todayKey = dk(today.y, today.m, today.d);
    var items = [];
    
    Object.keys(NOTES).forEach(function(k) {
        var n = NOTES[k];
        if (n.hasCheck && !n.checked) {
            var datePart = k.split('-s')[0];
            if (datePart < todayKey) {
                items.push({ key: k, title: n.title, description: n.description, datePart: datePart });
            }
        }
    });
    
    items.sort(function(a, b) { return a.datePart.localeCompare(b.datePart); });
    
    if (items.length === 0) {
        list.innerHTML = '<div class="empty-state">کار عقب افتاده ای نداری</div>';
    } else {
        var html = '';
        var allSlots = generateSlots();
        items.forEach(function(item) {
            var parts = item.datePart.split('-');
            var slotIdx = parseInt(item.key.split('-s')[1]);
            var slot = allSlots[slotIdx];
            var timeStr = slot ? slot.start : '';
            
            html += '<div class="pending-item">' +
                    '<div class="pi-info">' +
                    '<div class="pi-title">' + escapeHtml(item.title || 'بدون عنوان') + '</div>' +
                    '<div class="pi-meta">' + pnum(parts[2]) + ' ' + MONTHS[parseInt(parts[1]) - 1] + ' - ساعت ' + timeStr + '</div>' +
                    '</div>' +
                    '<div class="pi-actions">' +
                    '<button class="done" onclick="pendingDone(\'' + item.key + '\')" title="انجام شد">✓</button>' +
                    '<button class="del" onclick="pendingDelete(\'' + item.key + '\')" title="حذف">✕</button>' +
                    '</div>' +
                    '</div>';
        });
        list.innerHTML = html;
    }
    
    document.getElementById('pendingModal').classList.add('active');
}

function pendingDone(sKey) {
    if (!NOTES[sKey]) return;
    NOTES[sKey].checked = true;
    saveLocal();
    saveCloud(sKey, NOTES[sKey]);
    updatePendingBadge();
    openPending();
}

function pendingDelete(sKey) {
    delete NOTES[sKey];
    saveLocal();
    deleteCloud(sKey);
    updatePendingBadge();
    updateTodayInfo();
    openPending();
}

// ============ Theme ============
function toggleTheme() {
    isDark = !isDark;
    document.body.classList.toggle('light', !isDark);
    localStorage.setItem('taghvim-theme', isDark ? 'dark' : 'light');
}

// ============ Update All ============
function updateAllViews() {
    renderCalendar();
    if (document.getElementById('weekView').style.display === 'block') {
        renderWeek();
    }
    if (document.getElementById('dayView').style.display === 'block') {
        renderDayView();
    }
    updateTodayInfo();
    updatePendingBadge();
}

// ============ Init ============
async function init() {
    var savedTheme = localStorage.getItem('taghvim-theme');
    if (savedTheme === 'light') {
        isDark = false;
        document.body.classList.add('light');
    }
    
    loadLocal();
    renderCalendar();
    updateTodayInfo();
    updatePendingBadge();
    
    await loadCloud();
    updateAllViews();
    
    console.log('Taghvim 1405 ready');
}

init();
</script>
