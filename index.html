<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقویم ۱۴۰۵</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="تقویم ۱۴۰۵">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230f172a'/><text x='50' y='65' font-size='50' fill='white' text-anchor='middle' font-family='serif'>۱۴۰۵</text></svg>">
    <link rel="manifest" href="manifest.json">
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    
    <style>
        :root {
            /* رنگ‌های اصلی - خاکستری و سرمه‌ای */
            --bg-primary: #1a1f2e;
            --bg-secondary: #232838;
            --bg-tertiary: #2d3345;
            --bg-elevated: #363d52;
            
            /* شیشه مات */
            --glass-bg: rgba(45, 51, 69, 0.7);
            --glass-bg-strong: rgba(54, 61, 82, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            
            /* متن */
            --text-primary: #e8eaf0;
            --text-secondary: #9ba3b8;
            --text-muted: #6b7285;
            
            /* رنگ‌های تاکیدی */
            --accent-primary: #4a6fa5;
            --accent-secondary: #5d82b8;
            --accent-hover: #6089c7;
            --today-bg: #4a6fa5;
            --today-border: #5d82b8;
            --friday: #c47a7a;
            --thursday: #7a9bc4;
            --success: #6ba574;
            --warning: #c4a55d;
            --danger: #b85c5c;
            
            /* فاصله و انیمیشن */
            --transition: 0.2s ease;
            --radius: 8px;
            --radius-sm: 6px;
            --radius-lg: 12px;
        }
        
        /* حالت روشن (اختیاری) */
        body.light {
            --bg-primary: #e8eaf0;
            --bg-secondary: #dcdfe8;
            --bg-tertiary: #cdd2dd;
            --bg-elevated: #ffffff;
            --glass-bg: rgba(220, 223, 232, 0.8);
            --glass-bg-strong: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(0, 0, 0, 0.08);
            --glass-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --text-primary: #1a1f2e;
            --text-secondary: #4a5468;
            --text-muted: #7a8499;
            --accent-primary: #3a5a8a;
            --today-bg: #4a6fa5;
            --today-border: #3a5a8a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            overflow-x: hidden;
        }
        
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            transition: background var(--transition), color var(--transition);
            position: relative;
        }
        
        /* الگوی نقطه‌ای پس‌زمینه */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            max-width: 960px;
            margin: auto;
            position: relative;
            z-index: 1;
        }
        
        /* ============ هدر ============ */
        .header {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 20px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            position: sticky;
            top: 16px;
            z-index: 100;
            margin-bottom: 16px;
        }
        
        .header h1 {
            font-size: 1.15em;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: var(--text-primary);
        }
        .header h1::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: var(--accent-primary);
            margin-left: 10px;
            vertical-align: middle;
            border-radius: 2px;
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        /* دکمه‌های گوشه‌دار */
        .btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 9px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85em;
            font-weight: 500;
            transition: all var(--transition);
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }
        .btn:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border-color: var(--accent-primary);
        }
        .btn:active {
            transform: translateY(1px);
        }
        
        /* آیکون ساده SVG */
        .btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            opacity: 0.8;
        }
        
        /* Badge */
        .badge {
            background: var(--danger);
            color: white;
            font-size: 0.7em;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: 700;
            min-width: 18px;
            text-align: center;
            line-height: 1.4;
        }
        
        /* ============ نوار اطلاعات ============ */
        .info-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: var(--radius-lg);
            padding: 14px 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.9em;
        }
        .info-main {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            color: var(--text-primary);
        }
        .info-main .label {
            color: var(--text-muted);
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .info-date {
            color: var(--text-secondary);
            font-size: 0.85em;
            font-variant-numeric: tabular-nums;
        }
        
        /* ============ تب‌های نما ============ */
        .view-tabs {
            display: flex;
            gap: 4px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: var(--radius-lg);
            padding: 4px;
            margin-bottom: 16px;
        }
        .view-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 11px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.88em;
            font-weight: 600;
            transition: all var(--transition);
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        .view-tab:hover {
            color: var(--text-primary);
        }
        .view-tab.active {
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 2px 8px rgba(74, 111, 165, 0.3);
        }
        
        /* ============ کارت تقویم ============ */
        .calendar-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 16px;
        }
        
        .month-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--glass-border);
        }
        .month-nav h2 {
            font-size: 1.3em;
            font-weight: 700;
            flex: 1;
            text-align: center;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }
        .nav-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1em;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }
        .nav-btn:hover {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
            border-color: var(--accent-primary);
        }
        
        /* ============ جدول تقویم ============ */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        
        .day-name-cell {
            text-align: center;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.75em;
            padding: 10px 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .day-cell {
            aspect-ratio: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 1em;
            transition: all var(--transition);
            position: relative;
            user-select: none;
            padding: 4px;
            color: var(--text-primary);
        }
        .day-cell:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent-primary);
            transform: translateY(-1px);
        }
        .day-cell:active {
            transform: scale(0.97);
        }
        .day-cell.empty {
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.05);
            cursor: default;
        }
        .day-cell.empty:hover {
            transform: none;
            border-color: rgba(255, 255, 255, 0.05);
        }
        .day-cell.today {
            background: var(--today-bg);
            border-color: var(--today-border);
            font-weight: 700;
            color: white;
        }
        .day-cell.selected {
            background: var(--accent-primary);
            border-color: var(--accent-secondary);
            color: white;
        }
        .day-cell.friday:not(.today):not(.selected) {
            color: var(--friday);
        }
        .day-cell.thursday:not(.today):not(.selected) {
            color: var(--thursday);
        }
        
        .day-number {
            font-size: 1em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        
        .day-indicator {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--success);
        }
        
        /* ============ پنجره شناور ============ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 720px;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: var(--bg-tertiary);
        }
        .modal-header h3 {
            font-size: 1em;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.3px;
        }
        .modal-close {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.9em;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }
        .modal-close:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        
        .modal-body {
            padding: 18px 22px;
            overflow-y: auto;
            flex: 1;
            background: var(--bg-secondary);
        }
        
        .modal-body::-webkit-scrollbar,
        .slots-container::-webkit-scrollbar {
            width: 8px;
        }
        .modal-body::-webkit-scrollbar-track,
        .slots-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .modal-body::-webkit-scrollbar-thumb,
        .slots-container::-webkit-scrollbar-thumb {
            background: var(--bg-elevated);
            border-radius: 10px;
        }
        .modal-body::-webkit-scrollbar-thumb:hover,
        .slots-container::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }
        
        /* ============ بازه‌های زمانی ============ */
        .slots-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        
        .slot-row {
            display: grid;
            grid-template-columns: 110px 1fr 1fr;
            gap: 6px;
            align-items: stretch;
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 6px;
            transition: all var(--transition);
        }
        .slot-row:hover {
            border-color: var(--accent-primary);
        }
        .slot-row.has-note {
            border-right: 3px solid var(--success);
        }
        
        .slot-time {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75em;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            padding: 6px 4px;
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
        }
        
        .slot-input {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85em;
            transition: all var(--transition);
            width: 100%;
        }
        .slot-input::placeholder {
            color: var(--text-muted);
        }
        .slot-input:focus {
            outline: none;
            background: var(--bg-primary);
            border-color: var(--accent-primary);
        }
        
        /* ============ منوی Long Press ============ */
        .context-menu {
            position: fixed;
            background: var(--bg-elevated);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            padding: 4px;
            z-index: 2000;
            display: none;
            min-width: 180px;
            animation: menuPop 0.15s ease;
        }
        .context-menu.active {
            display: block;
        }
        
        @keyframes menuPop {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .context-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 500;
            transition: all var(--transition);
            color: var(--text-primary);
        }
        .context-menu-item:hover {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
        }
        .context-menu-item.danger {
            color: var(--danger);
        }
        .context-menu-item.danger:hover {
            background: rgba(184, 92, 92, 0.15);
        }
        
        /* ============ ریسپانسیو ============ */
        @media (max-width: 600px) {
            body {
                padding: 8px;
            }
            .header {
                padding: 12px 14px;
                top: 8px;
            }
            .header h1 {
                font-size: 0.95em;
            }
            .header h1::before {
                height: 16px;
            }
            .btn {
                padding: 8px 12px;
                font-size: 0.75em;
            }
            .info-bar {
                padding: 12px 14px;
                font-size: 0.8em;
            }
            .calendar-card {
                padding: 14px;
            }
            .calendar-grid {
                gap: 3px;
            }
            .day-cell {
                font-size: 0.85em;
                border-radius: 4px;
            }
            .day-name-cell {
                font-size: 0.65em;
                padding: 6px 2px;
            }
            .month-nav h2 {
                font-size: 1em;
            }
            .month-nav .nav-btn {
                width: 34px;
                height: 34px;
            }
            .modal {
                max-height: 95vh;
            }
            .slot-row {
                grid-template-columns: 80px 1fr;
                grid-template-rows: auto auto;
            }
            .slot-time {
                grid-row: span 2;
                font-size: 0.7em;
            }
            .slot-input {
                font-size: 0.8em;
                padding: 6px 8px;
            }
        }
        
        /* ============ انیمیشن ورود ============ */
        .fade-in-up {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- ============ هدر ============ -->
    <header class="header fade-in-up">
        <h1>تقویم ۱۴۰۵</h1>
        <div class="header-actions">
            <button class="btn" onclick="openPending()" title="کارهای عقب‌افتاده">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                عقب‌افتاده
                <span class="badge" id="pendingBadge">۰</span>
            </button>
            <button class="btn" onclick="openSettings()" title="تنظیمات">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </button>
            <button class="btn" onclick="toggleTheme()" title="تغییر تم">
                <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
            </button>
        </div>
    </header>
    
    <!-- ============ نوار اطلاعات ============ -->
    <div class="info-bar fade-in-up">
        <div class="info-main">
            <span class="label">برنامه امروز</span>
            <span id="todaySummary">۰ ساعت</span>
        </div>
        <div class="info-date" id="todayDate">۱۴۰۵/۰۱/۰۱</div>
    </div>
    
    <!-- ============ تب‌های نما ============ -->
    <div class="view-tabs fade-in-up">
        <button class="view-tab active" onclick="switchView('month', this)">ماهانه</button>
        <button class="view-tab" onclick="switchView('week', this)">هفتگی</button>
        <button class="view-tab" onclick="switchView('day', this)">روزانه</button>
    </div>
    
    <!-- ============ کارت تقویم ============ -->
    <div class="calendar-card fade-in-up">
        <div class="month-nav">
            <button class="nav-btn" onclick="prevMonth()">‹</button>
            <h2 id="monthTitle">فروردین ۱۴۰۵</h2>
            <button class="nav-btn" onclick="nextMonth()">›</button>
        </div>
        
        <div class="calendar-grid" id="calendarGrid">
            <!-- با JS پر میشه -->
        </div>
    </div>
    
</div>

<!-- ============ پنجره شناور روز ============ -->
<div class="modal-overlay" id="dayModal" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 id="modalTitle">۱۴۰۵/۰۱/۰۱ - شنبه</h3>
            <button class="modal-close" onclick="closeDayModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="slots-container" id="slotsContainer">
                <!-- با JS پر میشه -->
            </div>
        </div>
    </div>
</div>

<!-- ============ منوی Long Press ============ -->
<div class="context-menu" id="contextMenu">
    <div class="context-menu-item" onclick="menuAction('toggleCheck')">
        <span id="menuToggleText">فعال کردن تیک</span>
    </div>
    <div class="context-menu-item danger" onclick="menuAction('clear')">
        پاک کردن
    </div>
</div>

<script>
// ============ داده‌های پایه ============
const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const DAY_SHORT = ['ش','ی','د','س','چ','پ','ج'];
const DAYS_IN_MONTH = [31,31,31,31,31,31,30,30,30,30,30,29];

let currentMonth = 0;
let isDark = true;

// ============ تبدیل عدد ============
function toPersianNum(n) {
    return String(n).split('').map(c => '۰۱۲۳۴۵۶۷۸۹'[c]).join('');
}

// ============ نمایش تقویم ============
function renderCalendar() {
    const grid = document.getElementById('calendarGrid');
    const title = document.getElementById('monthTitle');
    
    title.textContent = MONTHS[currentMonth] + ' ۱۴۰۵';
    
    let html = '';
    
    // نام روزها
    DAY_SHORT.forEach(d => {
        html += `<div class="day-name-cell">${d}</div>`;
    });
    
    // فروردین ۱۴۰۵ از شنبه شروع میشه
    const firstDayOffset = 0;
    
    for (let i = 0; i < firstDayOffset; i++) {
        html += `<div class="day-cell empty"></div>`;
    }
    
    const daysCount = DAYS_IN_MONTH[currentMonth];
    for (let d = 1; d <= daysCount; d++) {
        const dayOfWeek = (d + firstDayOffset - 1) % 7;
        const isFriday = dayOfWeek === 6;
        const isThursday = dayOfWeek === 5;
        const isToday = (currentMonth === 0 && d === 1);
        
        let cls = 'day-cell';
        if (isFriday) cls += ' friday';
        if (isThursday) cls += ' thursday';
        if (isToday) cls += ' today';
        
        html += `<div class="${cls}" onclick="openDay(${d}, this)">
            <span class="day-number">${toPersianNum(d)}</span>
        </div>`;
    }
    
    grid.innerHTML = html;
}

function prevMonth() {
    currentMonth = (currentMonth - 1 + 12) % 12;
    renderCalendar();
}

function nextMonth() {
    currentMonth = (currentMonth + 1) % 12;
    renderCalendar();
}

// ============ باز کردن روز ============
function openDay(d, el) {
    // انتخاب روز
    document.querySelectorAll('.day-cell.selected').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    
    document.getElementById('modalTitle').textContent = 
        toPersianNum(1405) + '/' + String(currentMonth+1).padStart(2,'0') + '/' + String(d).padStart(2,'0') + ' - ' + MONTHS[currentMonth];
    
    const container = document.getElementById('slotsContainer');
    let html = '';
    
    // فقط ۰۶:۴۰ تا ۲۳:۴۵ (ساعت خواب مخفی)
    for (let h = 6; h < 24; h++) {
        for (let m = 0; m < 60; m += 15) {
            if (h === 6 && m < 40) continue;
            
            const start = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
            let eh = h, em = m + 15;
            if (em === 60) { eh++; em = 0; }
            if (eh === 24) eh = 0;
            const end = String(eh).padStart(2,'0') + ':' + String(em).padStart(2,'0');
            
            html += `<div class="slot-row">
                <div class="slot-time">${start} - ${end}</div>
                <input class="slot-input" placeholder="عنوان">
                <input class="slot-input" placeholder="توضیحات">
            </div>`;
        }
    }
    
    container.innerHTML = html;
    document.getElementById('dayModal').classList.add('active');
}

function closeDayModal() {
    document.getElementById('dayModal').classList.remove('active');
}

function closeModal(e) {
    if (e.target.id === 'dayModal') {
        closeDayModal();
    }
}

// ============ تب‌ها ============
function switchView(v, btn) {
    document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    
    // فعلاً فقط ماهانه
    if (v === 'month') {
        document.querySelector('.calendar-card').style.display = 'block';
    } else {
        alert('نمای ' + (v === 'week' ? 'هفتگی' : 'روزانه') + ' توی تیکه بعدی اضافه میشه');
        document.querySelector('.view-tab.active').classList.remove('active');
        document.querySelector('.view-tab').classList.add('active');
    }
}

// ============ تم ============
function toggleTheme() {
    isDark = !isDark
