<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقویم ۱۴۰۵</title>
    <meta name="theme-color" content="#3b82f6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="تقویم ۱۴۰۵">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root{--bg:#f0f2f5;--card:#fff;--text:#1a1a2e;--text-secondary:#6b7280;--border:#e5e7eb;--primary:#3b82f6;--primary-dark:#1d4ed8;--primary-light:#eff6ff;--today:#fef3c7;--today-border:#f59e0b;--friday:#ef4444;--thursday:#3b82f6;--success:#10b981;--shadow-sm:0 1px 2px rgba(0,0,0,0.05);--shadow:0 4px 6px rgba(0,0,0,0.07);--shadow-lg:0 10px 15px rgba(0,0,0,0.1);--radius:16px;--radius-sm:10px;--transition:0.2s}
        body.dark{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--text-secondary:#94a3b8;--border:#334155;--primary-light:#1e3a5f;--today:#3e3500;--shadow-sm:0 1px 2px rgba(0,0,0,0.3);--shadow:0 4px 6px rgba(0,0,0,0.4);--shadow-lg:0 10px 15px rgba(0,0,0,0.5)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;max-width:850px;margin:auto;transition:background var(--transition),color var(--transition)}
        .header{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--card);padding:14px 18px;border-radius:var(--radius);box-shadow:var(--shadow);position:sticky;top:10px;z-index:100;margin-bottom:16px;border:1px solid var(--border)}
        .header h2{font-size:1.2em;font-weight:800;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .sync-status{font-size:.7em;padding:4px 10px;border-radius:12px;background:var(--primary-light);color:var(--primary);white-space:nowrap}
        .sync-status.synced{background:#d1fae5;color:#065f46}
        select,button{padding:10px 16px;border-radius:25px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-family:'Vazirmatn',Tahoma,sans-serif;font-size:.85em;font-weight:500;transition:all var(--transition);white-space:nowrap}
        .btn-today{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;border-color:#f59e0b;font-weight:700}
        .btn-theme{background:linear-gradient(135deg,#e0e7ff,#c7d2fe);color:#3730a3;border-color:#818cf8}
        .month-title{text-align:center;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;padding:16px;border-radius:var(--radius);margin-bottom:12px;font-size:1.3em;font-weight:800;box-shadow:var(--shadow)}
        .nav-btns{display:flex;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap}
        .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;background:var(--card);padding:14px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:16px}
        .grid .day-name{font-weight:700;color:var(--text-secondary);font-size:.75em;padding:8px 2px}
        .grid .day-cell{padding:12px 4px;border-radius:var(--radius-sm);cursor:pointer;border:2px solid transparent;font-size:.9em;font-weight:500;transition:all var(--transition);user-select:none;position:relative}
        .grid .day-cell:hover{background:var(--primary-light);border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
        .grid .day-cell.today{background:var(--today);border-color:var(--today-border);font-weight:800;box-shadow:0 0 0 3px rgba(245,158,11,0.2)}
        .grid .day-cell.selected{background:#dbeafe;border-color:var(--primary-dark);font-weight:800}
        .grid .day-cell.friday{color:var(--friday);font-weight:700}
        .grid .day-cell.thursday{color:var(--thursday);font-weight:700}
        .grid .day-cell.empty{cursor:default}
        .grid .day-cell.has-note::after{content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 6px rgba(16,185,129,0.5)}
        .day-detail{background:var(--card);padding:20px;border-radius:var(--radius);box-shadow:var(--shadow-lg);margin-bottom:16px;border:1px solid var(--border);animation:slideUp .3s ease}
        @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .day-detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--border)}
        .day-detail-header h3{font-size:1.1em;font-weight:800;color:var(--primary-dark)}
        .close-btn{background:#fee2e2;color:#991b1b;border:none;padding:8px 18px;border-radius:20px;cursor:pointer;font-weight:600;font-size:.85em}
        .slots-scroll{max-height:60vh;overflow-y:auto;border-radius:var(--radius-sm);border:1px solid var(--border)}
        .slots-table{width:100%;border-collapse:collapse;font-size:.82em}
        .slots-table th{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-weight:700;padding:12px 10px;position:sticky;top:0;z-index:10;font-size:.9em}
        .slots-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
        .slots-table .time-col{width:110px;font-weight:700;text-align:center;white-space:nowrap;color:var(--primary-dark);font-size:.85em;border-radius:6px}
        .slots-table .time-col.has-note{background:#d1fae5;color:#065f46}
        .slots-table .note-col{width:auto}
        .slots-table .note-title{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:'Vazirmatn',Tahoma,sans-serif;font-size:.9em;font-weight:600;background:var(--card);color:var(--text);margin-bottom:4px}
        .slots-table .note-title:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.15);background:var(--primary-light)}
        .slots-table .note-description{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:'Vazirmatn',Tahoma,sans-serif;font-size:.8em;background:var(--card);color:var(--text-secondary);min-height:30px}
        .slots-table .note-description:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.15);background:var(--primary-light)}
        @media(max-width:600px){body{padding:8px}.header{padding:10px 12px;gap:6px}.header h2{font-size:1em}select,button{padding:7px 12px;font-size:.75em}.grid{padding:8px;gap:2px}.grid .day-cell{padding:8px 1px;font-size:.75em}.day-detail{padding:12px}.slots-table{font-size:.7em}.slots-table th,.slots-table td{padding:6px 4px}.slots-table .time-col{width:70px;font-size:.7em}.slots-table .note-title{font-size:.75em;padding:5px 6px}.slots-table .note-description{font-size:.7em;padding:5px 6px}}
    </style>
</head>
<body>

<div class="header">
    <h2>📅 تقویم ۱۴۰۵</h2>
    <span class="sync-status" id="syncStatus">🔄 در حال اتصال...</span>
    <select id="monthSelect"></select>
    <button class="btn-today" onclick="goToday()">📍 امروز</button>
    <button class="btn-theme" onclick="toggleTheme()">🌓</button>
</div>

<div id="calendar"></div>

<script>
(function() {
    const SUPABASE_URL = 'https://moaofxlfantlijlkmcoi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_mfrt-MTazEyu1UnkfhK7Dw_15WR3s5R';
    
    let supabase;
    try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        document.getElementById('syncStatus').textContent = '✅ آنلاین';
        document.getElementById('syncStatus').classList.add('synced');
    } catch(e) {
        document.getElementById('syncStatus').textContent = '⚠️ خطا';
    }
    
    const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
    const DAY_SHORT = ['ش','ی','د','س','چ','پ','ج'];
    const DAY_FULL = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه'];
    const DAYS_IN_MONTH = [31,31,31,31,31,31,30,30,30,30,30,29];
    const YEAR_START = new Date(2026, 2, 21);
    
    function g2p(d) {
        const gy=d.getFullYear(),gm=d.getMonth()+1,gd=d.getDate();
        const gdi=[31,28,31,30,31,30,31,31,30,31,30,31];
        if((gy%4===0&&gy%100!==0)||gy%400===0)gdi[1]=29;
        let dn=365*(gy-1600)+Math.floor((gy-1600+3)/4)-Math.floor((gy-1600+99)/100)+Math.floor((gy-1600+399)/400);
        for(let i=0;i<gm-1;i++)dn+=gdi[i];
        dn+=gd-1;
        let pn=dn-79,p=Math.floor(pn/12053);pn%=12053;
        let py=979+33*p+4*Math.floor(pn/1461);pn%=1461;
        if(pn>=366){py+=Math.floor((pn-1)/365);pn=(pn-1)%365;}
        const pdi=[31,31,31,31,31,31,30,30,30,30,30,29];
        let pm=0;while(pn>=pdi[pm]&&pm<11){pn-=pdi[pm];pm++;}
        return{y:py,m:pm+1,d:pn+1};
    }
    
    function pdow(d){return(d.getDay()+1)%7;}
    function pnum(n){return String(n).split('').map(c=>'۰۱۲۳۴۵۶۷۸۹'[c]).join('');}
    function dk(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
    function sk(dk,i){return `${dk}-s${i}`;}
    
    let cm=0;
    const today=g2p(new Date());
    let NOTES={};
    
    // Realtime - گوش دادن به تغییرات
// Realtime - گوش دادن به تغییرات
if(supabase){
    supabase
        .channel('notes-rt')
        .on('postgres_changes',{event:'INSERT',schema:'public',table:'notes'},payload=>{
            if(payload.new){
                const r=payload.new;
                NOTES[r.slot_key]={title:r.title||'',description:r.description||''};
                saveLocal();
                updateDots();
            }
        })
        .on('postgres_changes',{event:'UPDATE',schema:'public',table:'notes'},payload=>{
            if(payload.new){
                const r=payload.new;
                NOTES[r.slot_key]={title:r.title||'',description:r.description||''};
                saveLocal();
                updateDots();
            }
        })
        .subscribe((status) => {
            console.log('Realtime status:', status);
        });
}
    
    async function loadCloud(){
        if(!supabase)return;
        try{
            const{data,error}=await supabase.from('notes').select('*').eq('year',1405);
            if(error)throw error;
            if(data){data.forEach(r=>{NOTES[r.slot_key]={title:r.title||'',description:r.description||''};});saveLocal();updateDots();}
            document.getElementById('syncStatus').textContent='✅ همگام شد';
            document.getElementById('syncStatus').classList.add('synced');
        }catch(e){
            document.getElementById('syncStatus').textContent='📱 آفلاین';
        }
    }
    
async function saveCloud(sk_,t,d){
    if(!supabase)return;
    try{
        await supabase.from('notes').delete().eq('slot_key',sk_);
        await supabase.from('notes').insert({slot_key:sk_,year:1405,title:t,description:d,updated_at:new Date().toISOString()});
        document.getElementById('syncStatus').textContent='✅ ذخیره شد';
        document.getElementById('syncStatus').classList.add('synced');
    }catch(e){
        document.getElementById('syncStatus').textContent='💾 ذخیره محلی';
    }
}

// چک کردن خودکار هر ۵ ثانیه برای آپدیت
setInterval(async function(){
    if(!supabase)return;
    try{
        const{data}=await supabase.from('notes').select('*').eq('year',1405);
        if(data){
            let changed=false;
            data.forEach(r=>{
                const old=NOTES[r.slot_key];
                if(!old||old.title!==r.title||old.description!==r.description){
                    NOTES[r.slot_key]={title:r.title||'',description:r.description||''};
                    changed=true;
                }
            });
            if(changed){
                saveLocal();
                updateDots();
                document.getElementById('syncStatus').textContent='✅ همگام شد';
                document.getElementById('syncStatus').classList.add('synced');
            }
        }
    }catch(e){}
},5000);
    
    function loadLocal(){try{NOTES=JSON.parse(localStorage.getItem('tv7')||'{}');}catch(e){NOTES={};}}
    function saveLocal(){localStorage.setItem('tv7',JSON.stringify(NOTES));updateDots();}
    function hasNotes(dk_){for(let i=0;i<96;i++){const n=NOTES[sk(dk_,i)];if(n&&(n.title||n.description))return true;}return false;}
    function updateDots(){document.querySelectorAll('.day-cell[data-key]').forEach(c=>{if(hasNotes(c.dataset.key))c.classList.add('has-note');else c.classList.remove('has-note');});}
    
    function gfdm(m){const d=new Date(YEAR_START);for(let i=0;i<m;i++)d.setDate(d.getDate()+DAYS_IN_MONTH[i]);return d;}
    
    function renderMonth(m){
        cm=m;
        const cal=document.getElementById('calendar');
        const fd=gfdm(m);
        const sd=pdow(fd);
        const dim=DAYS_IN_MONTH[m];
        let h=`<div class="month-title">${MONTHS[m]} ۱۴۰۵</div>`;
        h+=`<div class="nav-btns"><button onclick="goPrev()">◀ ${MONTHS[m-1<0?11:m-1]}</button><button class="btn-today" onclick="goToday()">📍 امروز</button><button onclick="goNext()">${MONTHS[m+1>11?0:m+1]} ▶</button></div>`;
        h+=`<div class="grid">`;
        DAY_SHORT.forEach(d=>h+=`<div class="day-name">${d}</div>`);
        for(let i=0;i<sd;i++)h+=`<div class="day-cell empty"></div>`;
        const cur=new Date(fd);
        for(let d=1;d<=dim;d++){
            const pd=g2p(cur);
            const dow=pdow(cur);
            const dk_=dk(pd.y,pd.m,pd.d);
            let cls='day-cell';
            if(dow===6)cls+=' friday';
            if(dow===5)cls+=' thursday';
            if(pd.y===today.y&&pd.m===today.m&&pd.d===today.d)cls+=' today';
            if(hasNotes(dk_))cls+=' has-note';
            h+=`<div class="${cls}" data-m="${m}" data-d="${d}" data-key="${dk_}">${pnum(d)}</div>`;
            cur.setDate(cur.getDate()+1);
        }
        h+=`</div><div id="dayDetail" class="day-detail" style="display:none;"></div>`;
        cal.innerHTML=h;
        document.getElementById('monthSelect').value=m;
        cal.querySelectorAll('.day-cell:not(.empty)').forEach(cell=>{
            cell.addEventListener('click',function(){
                cal.querySelectorAll('.day-cell.selected').forEach(c=>c.classList.remove('selected'));
                this.classList.add('selected');
                showDetail(parseInt(this.dataset.m),parseInt(this.dataset.d));
            });
        });
    }
    
    function showDetail(m,day){
        const fd=gfdm(m);
        const td=new Date(fd.getTime()+(day-1)*86400000);
        const pd=g2p(td);
        const dow=pdow(td);
        const dk_=dk(pd.y,pd.m,pd.d);
        const detail=document.getElementById('dayDetail');
        let h=`<div class="day-detail-header"><h3>📅 ${pnum(pd.y)}/${String(pd.m).padStart(2,'0')}/${String(pd.d).padStart(2,'0')} - ${DAY_FULL[dow]}</h3><div style="display:flex;gap:8px;align-items:center;"><span style="font-size:.75em;color:var(--text-secondary);">💡 تایپ کنید، خودکار ذخیره و سینک می‌شود</span><button class="close-btn" onclick="document.getElementById('dayDetail').style.display='none'">✕</button></div></div>`;
        h+=`<div class="slots-scroll"><table class="slots-table"><thead><tr><th>⏰ بازه</th><th>📌 عنوان</th><th>📝 توضیحات</th></tr></thead><tbody>`;
        let si=0;
        for(let hh=0;hh<24;hh++){
            for(let mm=0;mm<60;mm+=15){
                const s=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
                let eh=hh,em=mm+15;
                if(em===60){eh++;em=0;}
                if(eh===24)eh=0;
                const e=`${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}`;
                const sKey=sk(dk_,si);
                const note=NOTES[sKey]||{title:'',description:''};
                const hc=note.title||note.description;
                h+=`<tr><td class="time-col${hc?' has-note':''}">${s}<br>${e}</td><td class="note-col"><input class="note-title" data-slot="${sKey}" data-field="title" value="${(note.title||'').replace(/"/g,'&quot;')}" placeholder="عنوان..."></td><td class="note-col"><input class="note-description" data-slot="${sKey}" data-field="description" value="${(note.description||'').replace(/"/g,'&quot;')}" placeholder="توضیحات..."></td></tr>`;
                si++;
            }
        }
        h+=`</tbody></table></div>`;
        detail.innerHTML=h;
        detail.style.display='block';
        detail.scrollIntoView({behavior:'smooth'});
        detail.querySelectorAll('input').forEach(inp=>{
            inp.addEventListener('input',function(){
                const sKey=this.dataset.slot;
                const field=this.dataset.field;
                if(!NOTES[sKey])NOTES[sKey]={title:'',description:''};
                NOTES[sKey][field]=this.value;
                const tr=this.closest('tr');
                if(tr){const tc=tr.querySelector('.time-col');if(tc){if(NOTES[sKey].title||NOTES[sKey].description)tc.classList.add('has-note');else tc.classList.remove('has-note');}}
                clearTimeout(this._st);
                this._st=setTimeout(()=>{saveLocal();saveCloud(sKey,NOTES[sKey].title,NOTES[sKey].description);},500);
            });
        });
    }
    
    window.goToday=function(){cm=today.m-1;renderMonth(cm);};
    window.goPrev=function(){cm=cm-1<0?11:cm-1;renderMonth(cm);};
    window.goNext=function(){cm=cm+1>11?0:cm+1;renderMonth(cm);};
    window.toggleTheme=function(){document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light');};
    
    loadLocal();
    const sel=document.getElementById('monthSelect');
    MONTHS.forEach((n,i)=>{const o=document.createElement('option');o.value=i;o.textContent=n;sel.appendChild(o);});
    sel.addEventListener('change',function(){renderMonth(parseInt(this.value));});
    if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');
    
    loadCloud().then(()=>renderMonth(today.m-1)).catch(()=>renderMonth(today.m-1));
})();
</script>
</body>
</html>
